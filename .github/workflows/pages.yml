name: Deploy portfolio to zoonii.zip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify static site
        run: |
          python3 scripts/verify-seo.py
          python3 -m unittest discover -s tests -p test_build.py
          node --test tests/*.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Check mobile layouts and touch flows
        env:
          MOBILE_SHOTS_DIR: mobile-screenshots
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/mobile-server.log" 2>&1 &
          node scripts/mobile-smoke.mjs
      - name: Upload mobile previews
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile-screenshots
          retention-days: 7
  deploy:
    needs: mobile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='tests' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site
      - name: Wait for uploaded Pages artifact
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const expected = Number(process.env.PAGES_ARTIFACT_ID);
            for (let attempt = 0; attempt < 10; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                name: process.env.PAGES_ARTIFACT
              });
              if (data.artifacts.some(artifact => artifact.id === expected && !artifact.expired)) {
                core.info('The uploaded Pages artifact is ready.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('The uploaded Pages artifact is not visible to the deployment API.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
